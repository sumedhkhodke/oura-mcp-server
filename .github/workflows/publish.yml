name: Publish to PyPI

# Publishes on a GitHub Release (or a pushed v* tag) using PyPI Trusted
# Publishing (OIDC) — no API token needed once you configure this repo as a
# trusted publisher at https://pypi.org/manage/account/publishing/.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
